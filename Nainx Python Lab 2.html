<style>

:root[data-theme="dark"]{--bg:#0b1411;--pn:#111d19;--pn2:#192a24;--ln:#26403a;--tx:#e3f3ec;--mu:#8fb0a2;--ac:#3ddc97;--ac2:#ffb454;--cd:#07100d;--ct:#d8eee5}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--pn);border-bottom:2px solid var(--ac);flex-wrap:wrap}
.brand{font-weight:800;font-size:23px;letter-spacing:-.03em}
.brand sup{font:500 12px 'Fira Code',monospace;color:var(--ac2);margin-left:4px}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}
.bar{width:150px;height:8px;background:var(--pn2);border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ac);transition:width .5s}
.ib{border:1px solid var(--ln);background:var(--pn2);border-radius:6px;padding:6px 10px}
.wrap{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--pn);border-right:1px solid var(--ln)}
.sh{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--ln)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:9px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--bg)}
#q{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--ln);background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}

.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#list{flex:1;overflow:auto;padding:6px}
.it{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border:0;border-left:3px solid transparent;border-radius:4px;background:none;content-visibility:auto;contain-intrinsic-size:auto 52px}
.it:hover{background:var(--pn2)}
.it.on{background:var(--pn2);border-left-color:var(--ac)}
.it span{flex:1;font-weight:600;line-height:1.25}
.it small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.tick{color:var(--ac);font-weight:800;visibility:hidden}.it.done .tick{visibility:visible}
.empty{padding:30px 14px;text-align:center;color:var(--mu)}
main{position:relative;overflow:auto;min-height:0}
#sp{position:sticky;top:0;height:3px;width:0;background:var(--ac2);z-index:5}
.dt{max-width:880px;margin:0 auto;padding:24px 22px 70px}
.hero{padding:70px 24px;text-align:center;color:var(--mu);max-width:560px;margin:0 auto;line-height:1.55}
.hero h2{font-size:32px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin-bottom:10px}
h1{font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1.08;letter-spacing:-.035em;margin:6px 0 8px}
.desc{color:var(--mu);margin-bottom:16px;line-height:1.55;max-width:60ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.btn.ok{border-color:var(--ac);color:var(--ac)}
.sl{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px}.sl input{accent-color:var(--ac)}
pre.code{background:var(--cd);color:var(--ct);border-radius:8px;padding:14px 0;overflow:auto;font:400 14px/1.65 'Fira Code',monospace;margin-bottom:14px;border:1px solid var(--ln);counter-reset:l}
.l{display:block;padding:0 18px 0 6px;white-space:pre}
.l::before{counter-increment:l;content:counter(l);display:inline-block;width:30px;margin-right:14px;text-align:right;color:#5f8274;user-select:none}
.l:hover{background:rgba(61,220,151,.08)}
.k{color:#ff9d6c}.s{color:#8fe8b0}.n{color:#ffd166}.c{color:#6f9585;font-style:italic}.f{color:#7fd4ff}
.term{background:var(--cd);color:#b9f5d8;border-radius:8px;font:400 14px/1.55 'Fira Code',monospace;padding:14px 16px;min-height:90px;overflow:auto;border:1px solid var(--ln);white-space:pre}
.term .cmd{color:#6f9585}.term .st{display:block;margin-top:8px;color:#3ddc97}
.cur{display:inline-block;width:8px;height:15px;background:#3ddc97;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.nv{display:flex;justify-content:space-between;margin-top:18px}
.back{display:none}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:4px;border:0;background:var(--ac);color:var(--bg);font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.top.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none;font-weight:600;z-index:20}

const $=i=>document.getElementById(i);
const st={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const IT=D.map(a=>({id:a[0],t:a[1],cat:a[2],ti:a[3],code:a[4],out:a[5]}));
let tab='p',cat='All',q='',cur=null,n=5,done=new Set(st.get('nx2_done','').split(',').filter(Boolean));
const KW=new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None match case'.split(' '));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(line){return esc(line).replace(/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(\()?/g,(m,c,s,nu,w,p)=>{
 if(c)return '<span class="c">'+c+'</span>';if(s)return '<span class="s">'+s+'</span>';if(nu)return '<span class="n">'+nu+'</span>';
 if(w&&KW.has(w))return '<span class="k">'+w+'</span>'+(p||'');if(w&&p)return '<span class="f">'+w+'</span>(';return m})}
function clean(code){const out=[];code.split('\n').forEach(l=>{let qt=null,o='';
 for(let k=0;k<l.length;k++){const c=l[k];if(qt){o+=c;if(c=='\\')o+=l[++k]||'';else if(c==qt)qt=null}else if(c=='"'||c=="'"){qt=c;o+=c}else if(c=='#')break;else o+=c}
 o=o.trimEnd();if(o.trim()===''&&l.trim()!=='')return;out.push(o)});return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n'}
const codeOf=i=>i.t=='s'?i.code.replace(/^n = \d+/m,'n = '+n):i.code;
const outOf=i=>i.t=='s'?i.out[n-3]:i.out;
const L=()=>IT.filter(i=>i.t==tab&&(cat=='All'||i.cat==cat)&&(!q||(i.ti+' '+i.cat).toLowerCase().includes(q)));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1600)}
function counts(){const p=IT.filter(i=>i.t=='p').length,s=IT.length-p;
 document.querySelector('[data-t=p]').textContent='Programs ('+p+')';document.querySelector('[data-t=s]').textContent='Patterns ('+s+')';
 $('pt').textContent=done.size+' of '+IT.length+' learned';$('pb').style.width=(done.size/IT.length*100)+'%';
 $('hp').textContent='Choose from '+IT.length.toLocaleString()+' examples on the left. Read the code, run it, then copy a clean version without comments.'}
function chips(){const cs=['All',...new Set(IT.filter(i=>i.t==tab).map(i=>i.cat))];
 $('cats').innerHTML=cs.map(c=>`<button class="chip ${cat==c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
function list(){const a=L();
 $('list').innerHTML=a.length?a.map(i=>`<button class="it ${cur&&cur.id==i.id?'on':''} ${done.has(i.id)?'done':''}" data-id="${i.id}"><span>${esc(i.ti)}<small>${esc(i.cat)}</small></span><b class="tick">✓</b></button>`).join(''):'<div class="empty">Nothing matches. Clear the search or pick another topic.</div>';
 $('list').scrollTop=0}
function drawCode(){$('code').innerHTML=codeOf(cur).trimEnd().split('\n').map(l=>`<span class="l">${hl(l)||' '}</span>`).join('')}
function show(id,push){const i=IT.find(x=>x.id==id);if(!i)return;cur=i;
 if(push)try{history.replaceState(null,'','#'+id)}catch(e){}
 const d=(i.code.match(/# (.*)/)||['',''])[1];
 $('dt').innerHTML=`<div class="dt"><button class="btn back" id="bk">← All examples</button>
 <h1>${esc(i.ti)}</h1><p class="desc">${esc(d)}</p>
 <div class="row"><span class="sl">Python 3</span>${i.t=='s'?`<label class="sl">Size <input type="range" id="sz" min="3" max="8" value="${n}"><b id="szv">${n}</b></label>`:''}</div>
 <pre class="code" id="code"></pre>
 <div class="row"><button class="btn pri" id="run">▶ Run</button><button class="btn" id="cp">Copy clean code</button><button class="btn" id="cpc">Copy with comments</button><button class="btn ${done.has(id)?'ok':''}" id="lr">${done.has(id)?'✓ Learned':'Mark as learned'}</button></div>
 <div class="term" id="term"><span class="cmd">Press Run to execute this program.</span></div>
 <div class="nv"><button class="btn" id="pv">← Previous</button><button class="btn" id="nx">Next →</button></div></div>`;
 drawCode();document.body.classList.add('sel');$('main').scrollTop=0;
 document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id==id));
 if(i.t=='s')run(true)}
let rt=0;
function run(quiet){const o=outOf(cur),tm=$('term'),ln=o.split('\n');if(ln[ln.length-1]==='')ln.pop();
 clearTimeout(rt);tm.innerHTML='<span class="cmd">$ python3 main.py</span>\n<span id="o"></span><span class="cur"></span>';
 const out=$('o');let k=0;const d=quiet?0:Math.min(70,900/Math.max(ln.length,1));
 (function step(){if(k<ln.length){out.textContent+=ln[k++]+'\n';tm.scrollTop=tm.scrollHeight;rt=setTimeout(step,d)}
 else tm.querySelector('.cur').outerHTML='<span class="st">Process finished with exit code 0</span>'})()}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(m)}catch(e){toast('Copy failed')}a.remove()})}
function nav(d){const a=L(),k=a.findIndex(x=>x.id==cur.id),m=a[k+d];if(m){show(m.id,1);const b=document.querySelector(`.it[data-id="${m.id}"]`);if(b)b.scrollIntoView({block:'nearest'})}else toast(d>0?'That was the last example':'This is the first example')}
function learned(){const i=cur;done.has(i.id)?done.delete(i.id):done.add(i.id);st.set('nx2_done',[...done].join(','));counts();
 const b=$('lr');b.classList.toggle('ok',done.has(i.id));b.textContent=done.has(i.id)?'✓ Learned':'Mark as learned';
 const it=document.querySelector(`.it[data-id="${i.id}"]`);if(it)it.classList.toggle('done',done.has(i.id));toast(done.has(i.id)?'Saved to your progress':'Removed from learned')}
function setTab(t){tab=t;cat='All';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));chips();list()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.closest('#tabs'))setTab(t.dataset.t);
 else if(t.dataset.c!==undefined){cat=t.dataset.c;chips();list()}
 else if(t.classList.contains('it'))show(t.dataset.id,1);
 else if(t.id=='run')run();
 else if(t.id=='cp')copy(clean(codeOf(cur)),'Copied clean code');
 else if(t.id=='cpc')copy(codeOf(cur),'Copied with comments');
 else if(t.id=='lr')learned();
 else if(t.id=='nx')nav(1);else if(t.id=='pv')nav(-1);
 else if(t.id=='bk'){document.body.classList.remove('sel');try{history.replaceState(null,'',location.pathname)}catch(e){}}
 else if(t.id=='rnd'){const a=IT.filter(i=>i.t==tab),p=a[Math.floor(Math.random()*a.length)];cat='All';chips();list();show(p.id,1);const b=document.querySelector(`.it[data-id="${p.id}"]`);if(b)b.scrollIntoView({block:'center'});toast('Random pick: '+p.ti)}
 else if(t.id=='top')$('main').scrollTop=0;
 else if(t.id=='th'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';st.set('nx2_theme',d.dataset.theme)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value.trim().toLowerCase();list()}
 if(e.target.id=='sz'){n=+e.target.value;$('szv').textContent=n;drawCode();run(true)}});
$('main').addEventListener('scroll',()=>{const m=$('main');$('sp').style.width=(m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight)*100)+'%';$('top').classList.toggle('on',m.scrollTop>400)});
const th=st.get('nx2_theme','');if(th)document.documentElement.dataset.theme=th;
function route(){const h=location.hash.slice(1),i=IT.find(x=>x.id==h);if(i){if(i.t!=tab)setTab(i.t);show(h,0)}}
counts();chips();list();addEventListener('hashchange',route);route();
</script>
